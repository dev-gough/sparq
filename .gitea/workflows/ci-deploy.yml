# sparqsys — CI + labserver deploy
#
# Flow: push master → verify build (Docker) → deploy (host) → systemctl restart
#
# Requires:
#   - Gitea Actions enabled + runner with labels: ubuntu-latest, labserver:host
#   - /home/server/bin/deploy-sparqsys.sh on the lab host
#   - passwordless sudo for systemctl restart sparqsys (user: server)

name: CI and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-sparqsys
  cancel-in-progress: false

jobs:
  # No unit test suite yet — production build is the CI gate (typecheck + compile).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy labserver
    needs: build
    runs-on: labserver
    steps:
      - name: Deploy sparqsys
        run: /home/server/bin/deploy-sparqsys.sh
